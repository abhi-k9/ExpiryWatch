name: Set up the build
description: Installs the JDK and Gradle with CI-specific settings.
runs:
  using: composite
  steps:
    - name: Copy CI Gradle properties
      shell: bash
      run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Keeps the post-job log short, so build failures are easy to find at its end.
        cache-cleanup: never
