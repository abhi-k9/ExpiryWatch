name: Release

# Publishes a GitHub release with signed APKs of both flavors, either when a version tag such as
# v1.2.3 is pushed, or when run from the Actions tab with a version, which tags the selected
# branch's latest commit. The app's version name and code come from the version.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Versions must look like 1.2.3 (each part 0-99), but got \"$version\"."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] &&
            git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::The tag v$version already exists."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - name: Set up release signing
        uses: ./.github/actions/release-signing
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Never publish a release signed with the debug key.
          required: true
      - name: Build signed release APKs
        run: ./gradlew assemblePlayRelease assembleFossRelease "-Pexpirywatch.versionName=$VERSION"
      - name: Collect the APKs and their checksums
        run: |
          mkdir dist
          for flavor in play foss; do
            cp app/build/outputs/apk/"$flavor"/release/*.apk "dist/ExpiryWatch-$VERSION-$flavor.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Install one of the two APKs; they have the same features and differ only in barcode scanning:

          - **ExpiryWatch-$VERSION-play.apk** uses Google ML Kit.
          - **ExpiryWatch-$VERSION-foss.apk** uses ZXing and contains no proprietary Google libraries.

          Both have the same app ID and signing key, so either one updates an existing installation."
          # On a manual run, this creates the tag on the commit that was built.
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "ExpiryWatch $VERSION" \
            --notes "$notes" \
            --generate-notes
