name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: >-
          ./gradlew --continue
          :core:model:test :core:common:test :core:domain:test :core:network:test
          testDebugUnitTest testPlayDebugUnitTest testFossDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests"

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # Only needed for a key whose password differs from the keystore's (not possible in PKCS12).
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Secrets are unavailable to pull requests from forks; those builds keep the debug key.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release keystore secret, so release APKs are signed with the debug key."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # keystore.properties is a Java properties file, where backslashes are escapes.
          escape() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$keystore"
            echo "storePassword=$(escape "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(escape "$KEY_ALIAS")"
            echo "keyPassword=$(escape "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}")"
          } > keystore.properties
      - name: Build debug and release APKs of both flavors
        run: ./gradlew --continue assemblePlayDebug assembleFossDebug assemblePlayRelease assembleFossRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint both flavors
        run: ./gradlew --continue :app:lintPlayDebug :app:lintFossDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*

  room-schema:
    name: Room schema is committed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate the database schema
        run: ./gradlew :core:database:kspDebugKotlin
      - name: Verify it matches the committed schema
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::The Room schema changed. Commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi
