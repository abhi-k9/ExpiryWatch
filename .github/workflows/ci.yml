name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI Gradle properties
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: >-
          ./gradlew --continue
          :core:model:test :core:common:test :core:domain:test :core:network:test
          testDebugUnitTest testPlayDebugUnitTest testFossDebugUnitTest

      - name: Verify Room schemas are committed
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::The Room schema changed. Commit these files:"
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi

      - name: Build APKs
        if: ${{ !cancelled() }}
        run: ./gradlew --continue assemblePlayDebug assembleFossDebug assemblePlayRelease assembleFossRelease

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew --continue :app:lintPlayDebug :app:lintFossDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
