name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: >-
          ./gradlew --continue
          :core:model:test :core:common:test :core:domain:test :core:network:test
          testDebugUnitTest testPlayDebugUnitTest testFossDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests"

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Set up release signing
        uses: ./.github/actions/release-signing
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Build debug and release APKs of both flavors
        run: ./gradlew --continue assemblePlayDebug assembleFossDebug assemblePlayRelease assembleFossRelease
      - name: Check that R8 kept ML Kit's components
        run: |
          # ML Kit finds its components by class name in manifest metadata and creates them by
          # reflection, so R8 must keep each of them, with its constructor, under its own name.
          manifest=$(find app/build/intermediates -path '*merged_manifest*playRelease*' -name AndroidManifest.xml | head -1)
          registrars=$(grep -o 'com\.google\.firebase\.components:[A-Za-z0-9_.$]*' "$manifest" | cut -d: -f2 | sort -u)
          if [ -z "$registrars" ]; then
            echo "::error::No ML Kit components found in $manifest"
            exit 1
          fi
          apk=$(find app/build/outputs/apk/play/release -name '*.apk' | head -1)
          methods=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only "$apk")
          status=0
          for registrar in $registrars; do
            if grep -F "$registrar" <<< "$methods" | grep -qF '<init>()'; then
              echo "Kept: $registrar"
            else
              echo "::error::R8 removed or renamed $registrar or its constructor."
              status=1
            fi
            grep -F "$registrar" <<< "$methods" || true
          done
          exit $status
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint both flavors
        run: ./gradlew --continue :app:lintPlayDebug :app:lintFossDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*

  room-schema:
    name: Room schema is committed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate the database schema
        run: ./gradlew :core:database:kspDebugKotlin
      - name: Verify it matches the committed schema
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::The Room schema changed. Commit the files below."
            git status --porcelain core/database/schemas
            find core/database/schemas -name '*.json' -print -exec cat {} \;
            exit 1
          fi
